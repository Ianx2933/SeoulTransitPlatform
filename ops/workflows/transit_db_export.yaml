# Weekly copy of the Cloud SQL database outside the instance.
#
# Cloud SQL's automated backups (daily, 7 days of point-in-time recovery) belong
# to the instance and are lost with it. This workflow exports the database as a
# compressed SQL dump to a private bucket whose lifecycle rule keeps 60 days.
#
#   export (on the instance, no paid offload) -> check the file exists and is
#   not implausibly small -> return its name and size
#
# The export blocks other admin operations on the instance for its duration
# (41 min on db-f1-micro, 2026-11-10), so it is scheduled away from the Tuesday
# pipeline, which changes the tier, and from the 03:00 automated backup. If an
# operation is already running anyway (HTTP 409), it retries every 10 minutes,
# three times, then fails and alerts.
#
# The dump has no triggers or functions (Cloud SQL export limitation). Restore
# with ops/restore_cloudsql_export.py.

main:
  steps:
    - init:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - instance: "transit-db"
          - database: "Seoul_Transit"
          - bucket: "seoul-transit-prod-pg-backups"
          - min_bytes: 500000000
          - now_kst: ${time.format(sys.now(), "Asia/Seoul")}
          - stamp: ${text.replace_all(text.substring(now_kst, 0, 10), "-", "") + "_" + text.replace_all(text.substring(now_kst, 11, 16), ":", "")}
          - object: ${"cloudsql/seoul_transit_" + stamp + ".sql.gz"}
    - log_start:
        call: sys.log
        args:
          text: ${"export " + database + " to gs://" + bucket + "/" + object}
    - export:
        try:
          call: googleapis.sqladmin.v1.instances.export
          args:
            project: ${project}
            instance: ${instance}
            body:
              exportContext:
                fileType: "SQL"
                uri: ${"gs://" + bucket + "/" + object}
                databases:
                  - ${database}
                offload: false
            connector_params:
              timeout: 7200
          result: operation
        retry:
          predicate: ${operation_in_progress}
          max_retries: 3
          backoff:
            initial_delay: 600
            max_delay: 600
            multiplier: 1
    - check:
        call: googleapis.storage.v1.objects.get
        args:
          bucket: ${bucket}
          object: ${text.url_encode(object)}
        result: meta
    - size_ok:
        switch:
          - condition: ${int(meta.size) < min_bytes}
            raise: '${"export is only " + meta.size + " bytes, gs://" + bucket + "/" + object}'
    - done:
        return: ${"exported gs://" + bucket + "/" + object + ", " + meta.size + " bytes"}


# Retry only when another operation holds the instance.
operation_in_progress:
  params: [e]
  steps:
    - check:
        switch:
          - condition: ${"code" in e and e.code == 409}
            return: true
    - other:
        return: false
