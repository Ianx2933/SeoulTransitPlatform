# Local infrastructure for development.
#
# Profiles let you start only what you need:
#   docker compose up -d                      # redis + postgres only
#   docker compose --profile app up -d        # + api-server, web-client
#   docker compose --profile airflow up -d    # + airflow
#
# Every credential comes from .env. Copy .env.example to .env first; no
# password is written in this file.

services:
  postgres:
    # PostGIS is required — the map demand APIs use ST_Contains and ST_DWithin.
    # The plain postgres image will not work.
    image: postgis/postgis:16-3.4
    container_name: seoul-transit-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-Seoul_Transit}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # DB_PASSWORD stays required. Unlike the variables above it affects the
      # default profile, and a silently wrong value would create a database
      # the API server then cannot authenticate against.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required - copy .env.example to .env}
    ports:
      # Conflicts with a PostgreSQL server already running on the host. If you
      # keep using a local install, either do not start this service or map a
      # different host port, e.g. "5433:5432".
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-Seoul_Transit}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: seoul-transit-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api-server:
    profiles: ["app"]
    build:
      context: ./services/api-server
    container_name: seoul-transit-api
    ports:
      - "8080:8080"
    environment:
      # Container-to-container hostnames, not localhost.
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-Seoul_Transit}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-local-dev-token}
      # validate, not update: the schema is created by database/schema/run_all.sql.
      JPA_DDL_AUTO: validate
      CACHE_TYPE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PREDICTION_SERVICE_BASE_URL: http://prediction:5000
      SEOUL_BUS_API_KEY: ${SEOUL_BUS_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  prediction:
    profiles: ["app"]
    build:
      context: ./services/prediction-service
    container_name: seoul-transit-prediction
    ports:
      - "5000:5000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-Seoul_Transit}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy

  web-client:
    profiles: ["app"]
    build:
      context: ./services/web-client
    container_name: seoul-transit-web
    ports:
      - "5173:80"
    depends_on:
      - api-server

  # ---------------------------------------------------------------------------
  # Airflow (optional)
  # ---------------------------------------------------------------------------
  # Airflow keeps its own metadata database, separate from Seoul_Transit.
  airflow-db:
    profiles: ["airflow"]
    image: postgres:16
    container_name: seoul-transit-airflow-db
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    profiles: ["airflow"]
    image: apache/airflow:2.9.0
    container_name: seoul-transit-airflow-init
    depends_on:
      airflow-db:
        condition: service_healthy
    environment: &airflow_env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-db/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      # Default rather than required. Variable interpolation runs across the
      # whole file regardless of profile, so a required Airflow variable would
      # block `docker compose config` and `--profile app` for people who never
      # use Airflow. The fallback name is deliberately unpleasant so it is
      # obvious when it reaches anything but a local machine.
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-local-dev-insecure-change-me}
      PIPELINE_DB_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-Seoul_Transit}
      TRANSIT_API_BASE_URL: http://api-server:8080
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      SEOUL_HOURLY_API_KEY: ${SEOUL_HOURLY_API_KEY:-}
    command: >
      bash -c "airflow db migrate &&
               airflow users create --username admin --password ${AIRFLOW_ADMIN_PASSWORD:-admin}
               --firstname admin --lastname admin --role Admin --email admin@example.com"

  airflow-webserver:
    profiles: ["airflow"]
    image: apache/airflow:2.9.0
    container_name: seoul-transit-airflow-web
    depends_on:
      - airflow-init
    ports:
      - "8081:8080"
    environment: *airflow_env
    volumes:
      - ./pipelines/airflow/dags:/opt/airflow/dags
    command: webserver

  airflow-scheduler:
    profiles: ["airflow"]
    image: apache/airflow:2.9.0
    container_name: seoul-transit-airflow-scheduler
    depends_on:
      - airflow-init
    environment: *airflow_env
    volumes:
      - ./pipelines/airflow/dags:/opt/airflow/dags
    command: scheduler

volumes:
  postgres_data:
  airflow_db_data:
